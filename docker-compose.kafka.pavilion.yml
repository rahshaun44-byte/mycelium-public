# =============================================================================
# Standalone Docker Compose configuration for the HP Pavilion node (qflex)
#
# Configured specifically for:
#   - 100.64.1.15 (Tailscale interface only)
#   - Memory caps matching the 1.9 GB Celeron hardware limits.
#
# Run with:
#   docker compose -f docker-compose.kafka.pavilion.yml up -d
# Or with Kafka UI:
#   docker compose -f docker-compose.kafka.pavilion.yml --profile ui up -d
# =============================================================================

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: qf-kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://100.64.1.15:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
    deploy:
      resources:
        limits:
          memory: 900M
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: qf-kafka-ui
    profiles: ["ui"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quantum-flex-mesh
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: '-Xmx256m'
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      - kafka
